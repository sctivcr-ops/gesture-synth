<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Gesture Synth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            text-align: center;
        }
        h1 { color: #667eea; margin-bottom: 20px; font-size: 2.5em; }
        p { color: #666; margin-bottom: 20px; font-size: 1.1em; }
        video { width: 100%; max-width: 500px; background: #000; border-radius: 10px; margin: 20px 0; transform: scaleX(-1); }
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .btn { padding: 15px; font-size: 1em; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; background: white; font-weight: bold; transition: all 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-color: #667eea; }
        .start-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 30px; font-size: 1.1em; border-radius: 8px; cursor: pointer; margin: 20px 0; }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        .status { margin-top: 20px; padding: 15px; background: #f5f7fa; border-radius: 8px; font-size: 1.2em; color: #667eea; font-weight: bold; }
        .loading { color: #667eea; font-size: 1.3em; padding: 20px; }
        @media (max-width: 600px) { .controls { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 1.8em; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Gesture Synth</h1>
        <p>손 제스처로 음악을 만드세요</p>
        <div id="loading" class="loading" style="display:none;">MediaPipe 로딩 중... 🔄</div>
        <div id="content" style="display:none;">
            <video id="video" playsinline></video>
            <div class="controls">
                <button class="btn" data-chord="0">C Major<br><small>도미솔</small></button>
                <button class="btn" data-chord="1">F Major<br><small>파라도</small></button>
                <button class="btn" data-chord="2">G Major<br><small>솔시레</small></button>
                <button class="btn" data-chord="3">A Minor<br><small>라도미</small></button>
            </div>
            <button class="start-btn" id="startBtn" onclick="startCamera()">🎬 시작</button>
            <button class="start-btn" id="stopBtn" onclick="stopCamera()" style="display:none; background: #999;">⏹️ 중지</button>
            <div class="status" id="status">준비 완료! 손을 화면에서 움직여보세요 👋</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script>
        const NOTES = { 'C': 261.63, 'D': 293.66, 'E': 329.63, 'F': 349.23, 'G': 391.99, 'A': 440.00, 'B': 493.88, 'C_high': 523.25 };
        const CHORDS = { 'C': ['C', 'E', 'G'], 'F': ['F', 'A', 'C_high'], 'G': ['G', 'B', 'D'], 'Am': ['A', 'C_high', 'E'] };
        const CHORD_NAMES = ['C Major', 'F Major', 'G Major', 'A Minor'];
        const CHORD_ORDER = ['C', 'F', 'G', 'Am'];
        
        let audioContext, camera, hands, isRunning = false, lastChord = -1, lastTime = 0;

        function initAudio() {
            if (!audioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
            }
        }

        function playChord(chordKey) {
            initAudio();
            const now = audioContext.currentTime;
            const notes = CHORDS[chordKey];
            notes.forEach(note => {
                const freq = NOTES[note];
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            });
        }

        async function startCamera() {
            if (!camera) {
                const video = document.getElementById('video');
                camera = new Camera(video, {
                    onFrame: async () => {
                        if (isRunning && hands) await hands.send({ image: video });
                    },
                    width: 640,
                    height: 480
                });
            }
            isRunning = true;
            await camera.start();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
        }

        function stopCamera() {
            isRunning = false;
            camera.stop();
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
        }

        async function initHands() {
            document.getElementById('loading').style.display = 'block';
            try {
                hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
                hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
                hands.onResults(onResults);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                console.log('✅ MediaPipe 로드 완료!');
            } catch (error) {
                console.error('❌ 실패:', error);
                document.getElementById('loading').innerHTML = '로딩 실패. 페이지를 새로고침하세요.';
            }
        }

        function onResults(results) {
            if (!isRunning) return;
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                let totalX = 0;
                landmarks.forEach(lm => totalX += lm.x);
                const centerX = totalX / landmarks.length;
                const chordIdx = Math.min(Math.floor(centerX * CHORD_ORDER.length), CHORD_ORDER.length - 1);
                const now = Date.now();
                if (chordIdx !== lastChord || now - lastTime > 300) {
                    playChord(CHORD_ORDER[chordIdx]);
                    lastChord = chordIdx;
                    lastTime = now;
                    document.getElementById('status').textContent = `🎵 재생: ${CHORD_NAMES[chordIdx]}`;
                    updateButtons(chordIdx);
                }
            }
        }

        function updateButtons(activeIdx) {
            document.querySelectorAll('.controls .btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === activeIdx);
            });
        }

        document.querySelectorAll('.controls .btn').forEach((btn, idx) => {
            btn.addEventListener('click', () => {
                playChord(CHORD_ORDER[idx]);
                updateButtons(idx);
            });
        });

        window.addEventListener('load', initHands);
    </script>
</body>
</html>
